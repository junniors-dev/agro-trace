<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Shield outline -->
  <path d="M100 8 L185 45 C185 45 185 130 100 190 C15 130 15 45 15 45 Z"
        stroke="#14532D" stroke-width="8" fill="none" stroke-linejoin="round"/>

  <!-- Leaf body (tilted, inside shield) -->
  <path d="M65 145 C55 110 65 70 105 50 C110 75 108 115 75 140 Z"
        fill="#14532D"/>

  <!-- Leaf stem -->
  <path d="M65 145 C70 130 80 115 105 50" stroke="#14532D" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Leaf vein (white) -->
  <path d="M72 138 C80 115 90 90 105 55" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- QR code pattern inside the leaf -->
  <g fill="white">
    <!-- Top-left QR module -->
    <rect x="78" y="70" width="8" height="8" rx="1"/>
    <rect x="78" y="70" width="8" height="8" rx="1" stroke="white" stroke-width="0.5" fill="none"/>
    <rect x="80" y="72" width="4" height="4" rx="0.5" fill="white"/>

    <!-- Top-right QR module -->
    <rect x="92" y="65" width="8" height="8" rx="1"/>
    <rect x="94" y="67" width="4" height="4" rx="0.5" fill="#14532D"/>

    <!-- Middle modules -->
    <rect x="82" y="82" width="5" height="5" rx="0.5"/>
    <rect x="90" y="78" width="5" height="5" rx="0.5"/>
    <rect x="97" y="75" width="4" height="4" rx="0.5"/>

    <!-- Bottom modules -->
    <rect x="76" y="90" width="6" height="6" rx="0.5"/>
    <rect x="85" y="88" width="4" height="4" rx="0.5"/>
    <rect x="75" y="100" width="5" height="5" rx="0.5"/>
    <rect x="83" y="97" width="4" height="3" rx="0.5"/>
    <rect x="90" y="85" width="3" height="3" rx="0.5"/>

    <!-- Scattered small dots -->
    <rect x="78" y="108" width="3" height="3" rx="0.3"/>
    <rect x="72" y="112" width="4" height="3" rx="0.3"/>
    <rect x="84" y="104" width="3" height="3" rx="0.3"/>
    <rect x="92" y="92" width="3" height="3" rx="0.3"/>
  </g>

  <!-- Checkmark (bold, lower right of shield) -->
  <path d="M110 120 L125 138 L160 95"
        stroke="#14532D" stroke-width="10" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
